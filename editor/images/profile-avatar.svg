<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ff758c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#140222" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haloGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="50%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#120220"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3d1"/>
      <stop offset="100%" stop-color="#f5cbb0"/>
    </linearGradient>
    <filter id="pBloom">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circular background to fit avatar circle seamlessly -->
  <circle cx="300" cy="300" r="300" fill="#150325"/>
  <circle cx="300" cy="300" r="280" fill="url(#avatarGlow)"/>

  <!-- Radiant Golden Halo Ring -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="url(#haloGold)" stroke-width="3" stroke-dasharray="10 8" filter="url(#pBloom)"/>
  <circle cx="300" cy="300" r="255" fill="none" stroke="#ff758c" stroke-width="1.5" opacity="0.6"/>

  <!-- Silhouette Shoulders & Gown (Centered) -->
  <path d="M 220 440 C 220 390 245 360 270 350 L 330 350 C 355 360 380 390 380 440 C 405 460 480 500 500 580 L 100 580 C 120 500 195 460 220 440 Z" fill="url(#skinTone)"/>
  <path d="M 160 490 C 220 460 265 480 300 480 C 335 480 380 460 440 490 L 500 580 L 100 580 Z" fill="url(#hairGrad)" stroke="url(#haloGold)" stroke-width="3"/>

  <!-- Flowing Hair Behind -->
  <path d="M 180 260 C 160 340 150 440 190 510 C 210 450 200 370 220 300 Z" fill="url(#hairGrad)"/>
  <path d="M 420 260 C 440 340 450 440 410 510 C 390 450 400 370 380 300 Z" fill="url(#hairGrad)"/>

  <!-- Face Grace Profile (Centered at cx=300, cy=250) -->
  <ellipse cx="300" cy="250" rx="80" ry="105" fill="url(#skinTone)"/>

  <!-- Front Hair Style -->
  <path d="M 220 230 C 220 150 260 120 300 120 C 340 120 380 150 380 230 C 360 190 330 170 300 170 C 270 170 240 190 220 230 Z" fill="url(#hairGrad)"/>
  <path d="M 220 220 C 205 280 215 340 225 380 C 235 320 230 260 225 220 Z" fill="#2a0845"/>
  <path d="M 380 220 C 395 280 385 340 375 380 C 365 320 370 260 375 220 Z" fill="#2a0845"/>

  <!-- Golden Tiara on hair -->
  <g filter="url(#pBloom)" transform="translate(300, 125)">
    <path d="M -60 10 L -40 -18 L -18 2 L 0 -30 L 18 2 L 40 -18 L 60 10 Z" fill="url(#haloGold)" stroke="#d4af37" stroke-width="2"/>
    <circle cx="0" cy="-30" r="5" fill="#ffffff"/>
    <circle cx="-40" cy="-18" r="4" fill="#ff758c"/>
    <circle cx="40" cy="-18" r="4" fill="#ff758c"/>
  </g>

  <!-- Gentle Sparkles -->
  <g fill="#ffd700" filter="url(#pBloom)">
    <circle cx="160" cy="180" r="3.5"/><circle cx="440" cy="180" r="3.5"/>
    <circle cx="140" cy="360" r="4"/><circle cx="460" cy="360" r="4"/>
    <circle cx="300" cy="65" r="4"/>
  </g>
</svg>
