<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0a5a"/>
      <stop offset="100%" stop-color="#781862"/>
    </linearGradient>
    <radialGradient id="glowRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mBloom">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark Rich Card Background -->
  <rect width="500" height="580" rx="24" fill="#180426"/>

  <!-- Inner Picture Frame Area -->
  <rect x="35" y="35" width="430" height="390" rx="18" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="160" fill="url(#glowRad)"/>

  <!-- Icon Scene based on type -->
  
<g transform="translate(250, 220)" filter="url(#mBloom)">
  <circle cx="0" cy="0" r="85" fill="#ffd700" opacity="0.25"/>
  <!-- Glowing smiling moon & flowers -->
  <circle cx="0" cy="0" r="70" fill="#ffd54f"/>
  <circle cx="-25" cy="-15" r="8" fill="#4a154b"/>
  <circle cx="25" cy="-15" r="8" fill="#4a154b"/>
  <path d="M -30 20 Q 0 55 30 20" fill="none" stroke="#4a154b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="-38" cy="18" r="9" fill="#ff758c" opacity="0.7"/>
  <circle cx="38" cy="18" r="9" fill="#ff758c" opacity="0.7"/>
</g>


  <!-- Lower Title / Caption area with gold & cursive text -->
  <text x="250" y="475" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="34" fill="#ffd700" text-anchor="middle" font-weight="600">Radiant Smile</text>
  <text x="250" y="520" font-family="'Montserrat', sans-serif" font-size="14" fill="#e0b8ff" text-anchor="middle" letter-spacing="2">Laughter That Brightens Every Room</text>

  <!-- Sparkles -->
  <g fill="#ffd700" filter="url(#mBloom)">
    <circle cx="65" cy="65" r="3"/><circle cx="435" cy="65" r="3"/>
    <circle cx="70" cy="395" r="2.5"/><circle cx="430" cy="395" r="2.5"/>
  </g>
</svg>