<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="balloonPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ebadff"/>
      <stop offset="40%" stop-color="#9d32d4"/>
      <stop offset="85%" stop-color="#46006e"/>
      <stop offset="100%" stop-color="#240038"/>
    </radialGradient>
    <radialGradient id="balloonPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd1dc"/>
      <stop offset="40%" stop-color="#ff4f7e"/>
      <stop offset="85%" stop-color="#b80c44"/>
      <stop offset="100%" stop-color="#54001c"/>
    </radialGradient>
    <radialGradient id="balloonGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffdf6b"/>
      <stop offset="75%" stop-color="#cf9410"/>
      <stop offset="100%" stop-color="#694300"/>
    </radialGradient>
    <radialGradient id="balloonViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d4b5ff"/>
      <stop offset="45%" stop-color="#6a35d9"/>
      <stop offset="85%" stop-color="#2c0c75"/>
      <stop offset="100%" stop-color="#11003d"/>
    </radialGradient>
    <filter id="bBloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="30" fill="#140222"/>

  <!-- Balloon Strings -->
  <g stroke="#e2b852" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 210 240 Q 230 380 295 480"/>
    <path d="M 390 230 Q 370 370 305 480"/>
    <path d="M 180 320 Q 240 410 295 480"/>
    <path d="M 420 330 Q 360 410 305 480"/>
    <path d="M 290 180 Q 295 350 300 480"/>
    <path d="M 300 480 Q 280 540 260 570"/>
    <path d="M 300 480 Q 320 540 335 570"/>
  </g>

  <!-- Golden Tie Knot -->
  <ellipse cx="300" cy="480" rx="14" ry="7" fill="#ffd700" filter="url(#bBloom)"/>

  <!-- Back Balloons -->
  <!-- Left purple -->
  <g transform="translate(180, 270)">
    <ellipse cx="0" cy="0" rx="65" ry="80" fill="url(#balloonPurple)"/>
    <polygon points="0,78 -10,90 10,90" fill="#5c1285"/>
    <ellipse cx="-22" cy="-30" rx="16" ry="30" fill="#fff" opacity="0.35" transform="rotate(-20 -22 -30)"/>
  </g>

  <!-- Right violet -->
  <g transform="translate(420, 280)">
    <ellipse cx="0" cy="0" rx="68" ry="82" fill="url(#balloonViolet)"/>
    <polygon points="0,80 -10,92 10,92" fill="#380d85"/>
    <ellipse cx="-24" cy="-30" rx="16" ry="32" fill="#fff" opacity="0.35" transform="rotate(-20 -24 -30)"/>
  </g>

  <!-- Mid Pink Left -->
  <g transform="translate(220, 190)">
    <ellipse cx="0" cy="0" rx="72" ry="90" fill="url(#balloonPink)"/>
    <polygon points="0,88 -10,100 10,100" fill="#9e0a39"/>
    <ellipse cx="-25" cy="-35" rx="18" ry="36" fill="#fff" opacity="0.4" transform="rotate(-20 -25 -35)"/>
  </g>

  <!-- Mid Gold Right -->
  <g transform="translate(380, 180)">
    <ellipse cx="0" cy="0" rx="70" ry="88" fill="url(#balloonGold)"/>
    <polygon points="0,86 -10,98 10,98" fill="#a17006"/>
    <ellipse cx="-24" cy="-32" rx="18" ry="35" fill="#fff" opacity="0.5" transform="rotate(-20 -24 -32)"/>
  </g>

  <!-- Front Center Majestic Gold & Pink Foil Balloon -->
  <g transform="translate(300, 140)">
    <ellipse cx="0" cy="0" rx="80" ry="100" fill="url(#balloonGold)"/>
    <polygon points="0,98 -12,112 12,112" fill="#b07d08"/>
    <ellipse cx="-30" cy="-40" rx="22" ry="42" fill="#fff" opacity="0.6" transform="rotate(-22 -30 -40)"/>
    <!-- Heart icon on gold balloon -->
    <path d="M 0 -10 C -15 -35 -40 -15 -40 10 C -40 35 0 60 0 60 C 0 60 40 35 40 10 C 40 -15 15 -35 0 -10 Z" fill="#ff4f7e" opacity="0.4" transform="scale(0.55) translate(0, -10)"/>
  </g>

  <!-- Confetti Sparkles -->
  <g fill="#ffd700" filter="url(#bBloom)">
    <circle cx="90" cy="180" r="4"/><circle cx="510" cy="190" r="5"/><circle cx="120" cy="450" r="3"/><circle cx="480" cy="440" r="4"/>
    <rect x="140" y="100" width="8" height="12" rx="2" fill="#ff758c" transform="rotate(25 140 100)"/>
    <rect x="440" y="100" width="8" height="12" rx="2" fill="#bf7fff" transform="rotate(-35 440 100)"/>
    <rect x="490" y="270" width="10" height="6" rx="2" fill="#ffd700" transform="rotate(45 490 270)"/>
    <rect x="100" y="320" width="9" height="6" rx="2" fill="#ff4f7e" transform="rotate(-15 100 320)"/>
  </g>
</svg>