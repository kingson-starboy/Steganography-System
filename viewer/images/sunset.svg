<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190326"/>
      <stop offset="25%" stop-color="#3d0c5a"/>
      <stop offset="50%" stop-color="#7b186b"/>
      <stop offset="75%" stop-color="#d94b68"/>
      <stop offset="90%" stop-color="#fca356"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff2a1"/>
      <stop offset="70%" stop-color="#ff7f50" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#330b45"/>
      <stop offset="40%" stop-color="#240533"/>
      <stop offset="100%" stop-color="#12011b"/>
    </linearGradient>
    <filter id="sunBloom">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="420" fill="url(#skyGrad)"/>

  <!-- Stars in upper sky -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="50" r="1.5"/><circle cx="160" cy="80" r="2"/><circle cx="250" cy="40" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/><circle cx="430" cy="35" r="1.5"/><circle cx="520" cy="65" r="2"/>
    <circle cx="480" cy="110" r="1"/><circle cx="120" cy="120" r="1"/>
  </g>

  <!-- Giant Golden Sun -->
  <circle cx="300" cy="310" r="130" fill="url(#sunGlow)" filter="url(#sunBloom)"/>
  <circle cx="300" cy="310" r="50" fill="#fff7d6"/>

  <!-- Dreamy Clouds -->
  <g fill="#ff758c" opacity="0.35">
    <ellipse cx="140" cy="260" rx="120" ry="25"/>
    <ellipse cx="460" cy="240" rx="150" ry="30"/>
    <ellipse cx="380" cy="290" rx="90" ry="18"/>
  </g>
  <g fill="#5e1563" opacity="0.45">
    <ellipse cx="220" cy="190" rx="140" ry="20"/>
    <ellipse cx="490" cy="170" rx="110" ry="18"/>
  </g>

  <!-- Distant Mountain Silhouettes -->
  <path d="M 0 380 Q 90 320 200 370 Q 320 310 440 375 Q 530 330 600 380 L 600 420 L 0 420 Z" fill="#2d063b"/>

  <!-- Reflective Water / Horizon -->
  <rect y="400" width="600" height="200" fill="url(#waterGrad)"/>

  <!-- Sun Reflection on Water -->
  <g fill="#ffb84d" opacity="0.6">
    <ellipse cx="300" cy="415" rx="80" ry="4"/>
    <ellipse cx="300" cy="430" rx="65" ry="3.5"/>
    <ellipse cx="300" cy="450" rx="50" ry="3"/>
    <ellipse cx="300" cy="475" rx="35" ry="2.5"/>
    <ellipse cx="300" cy="510" rx="20" ry="2"/>
  </g>

  <!-- Shore & Couple/Girl Silhouette watching sunset with balloons -->
  <path d="M 0 540 Q 150 510 320 550 Q 480 520 600 560 L 600 600 L 0 600 Z" fill="#0d0014"/>

  <!-- Silhouette of Birthday Girl on shore with floating heart balloon -->
  <g fill="#ffd700" opacity="0.9">
    <path d="M 290 500 Q 300 495 300 485 Q 300 495 310 500 Q 300 505 300 515 Q 300 505 290 500 Z"/>
    <circle cx="210" cy="490" r="2.5"/>
    <circle cx="390" cy="485" r="2.5"/>
  </g>
</svg>