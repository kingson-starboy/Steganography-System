<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47104b"/>
      <stop offset="100%" stop-color="#8a1c58"/>
    </linearGradient>
    <radialGradient id="glowRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mBloom">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark Rich Card Background -->
  <rect width="500" height="500" rx="16" fill="#180426"/>

  <!-- Inner Picture Frame Area -->
  <rect x="35" y="35" width="430" height="390" rx="18" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="160" fill="url(#glowRad)"/>

  <!-- Icon Scene based on type -->
  
<g transform="translate(250, 220)" filter="url(#mBloom)">
  <!-- Sunburst -->
  <circle cx="0" cy="0" r="45" fill="#ffd700"/>
  <g stroke="#ffd700" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-75" x2="0" y2="-55"/>
    <line x1="0" y1="55" x2="0" y2="75"/>
    <line x1="-75" y1="0" x2="-55" y2="0"/>
    <line x1="55" y1="0" x2="75" y2="0"/>
    <line x1="-50" y1="-50" x2="-35" y2="-35"/>
    <line x1="35" y1="35" x2="50" y2="50"/>
    <line x1="-50" y1="50" x2="-35" y2="35"/>
    <line x1="35" y1="-35" x2="50" y2="-50"/>
  </g>
  <circle cx="0" cy="0" r="28" fill="#fff" opacity="0.9"/>
</g>


  <!-- Lower Title / Caption area with gold & cursive text -->
  
  

  <!-- Sparkles -->
  <g fill="#ffd700" filter="url(#mBloom)">
    <circle cx="65" cy="65" r="3"/><circle cx="435" cy="65" r="3"/>
    <circle cx="70" cy="395" r="2.5"/><circle cx="430" cy="395" r="2.5"/>
  </g>
</svg>