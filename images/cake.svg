<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff758c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a002c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="tierBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d0e5a"/>
      <stop offset="50%" stop-color="#691d8a"/>
      <stop offset="100%" stop-color="#3d0e5a"/>
    </linearGradient>
    <linearGradient id="tierMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#731963"/>
      <stop offset="50%" stop-color="#b83280"/>
      <stop offset="100%" stop-color="#731963"/>
    </linearGradient>
    <linearGradient id="tierTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a0f69"/>
      <stop offset="50%" stop-color="#8c25aa"/>
      <stop offset="100%" stop-color="#4a0f69"/>
    </linearGradient>
    <linearGradient id="frostingGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff1a8"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe600"/>
      <stop offset="70%" stop-color="#ff5100"/>
      <stop offset="100%" stop-color="#ff0044" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="280" fill="url(#cakeGlow)"/>

  <!-- Stand / Plate -->
  <ellipse cx="300" cy="510" rx="220" ry="25" fill="#120220" opacity="0.6"/>
  <ellipse cx="300" cy="495" rx="200" ry="24" fill="url(#goldPlate)"/>
  <ellipse cx="300" cy="490" rx="190" ry="20" fill="#fdf0cd"/>

  <!-- Bottom Tier -->
  <path d="M 140 430 L 140 480 A 160 30 0 0 0 460 480 L 460 430 Z" fill="url(#tierBottom)"/>
  <ellipse cx="300" cy="430" rx="160" ry="25" fill="#521570"/>
  <!-- Bottom Frosting drips & gold pearls -->
  <path d="M 140 430 C 160 455, 170 455, 190 430 C 210 460, 230 460, 250 430 C 270 458, 290 458, 310 430 C 330 462, 350 462, 370 430 C 390 455, 410 455, 430 430 C 445 450, 455 440, 460 430" fill="none" stroke="url(#frostingGold)" stroke-width="8" stroke-linecap="round"/>
  <!-- Gold beads along bottom rim -->
  <g fill="#ffd700">
    <circle cx="150" cy="478" r="5"/><circle cx="180" cy="488" r="5"/><circle cx="210" cy="495" r="5"/>
    <circle cx="250" cy="499" r="5"/><circle cx="300" cy="501" r="5"/><circle cx="350" cy="499" r="5"/>
    <circle cx="390" cy="495" r="5"/><circle cx="420" cy="488" r="5"/><circle cx="450" cy="478" r="5"/>
  </g>

  <!-- Middle Tier -->
  <path d="M 180 340 L 180 410 A 120 22 0 0 0 420 410 L 420 340 Z" fill="url(#tierMiddle)"/>
  <ellipse cx="300" cy="340" rx="120" ry="20" fill="#99236d"/>
  <!-- Middle Tier Drips -->
  <path d="M 180 340 C 200 365, 215 365, 235 340 C 255 370, 275 370, 295 340 C 315 368, 335 368, 355 340 C 375 365, 395 365, 415 340" fill="none" stroke="url(#frostingGold)" stroke-width="7" stroke-linecap="round"/>

  <!-- Top Tier -->
  <path d="M 220 250 L 220 320 A 80 18 0 0 0 380 320 L 380 250 Z" fill="url(#tierTop)"/>
  <ellipse cx="300" cy="250" rx="80" ry="16" fill="#781d94"/>
  <!-- Top Frosting & Rosettes -->
  <path d="M 220 250 C 235 272, 250 272, 265 250 C 280 275, 300 275, 315 250 C 335 272, 355 272, 380 250" fill="none" stroke="url(#frostingGold)" stroke-width="6" stroke-linecap="round"/>

  <!-- Rosettes decoration on top -->
  <g fill="#ff758c">
    <circle cx="235" cy="248" r="10"/><circle cx="265" cy="245" r="9"/><circle cx="335" cy="245" r="9"/><circle cx="365" cy="248" r="10"/>
  </g>
  <g fill="#ffb3c6">
    <circle cx="235" cy="248" r="5"/><circle cx="265" cy="245" r="4"/><circle cx="335" cy="245" r="4"/><circle cx="365" cy="248" r="5"/>
  </g>

  <!-- Number 21 Gold Cake Topper -->
  <g filter="url(#glowEffect)">
    <!-- Crown Topper -->
    <path d="M 275 185 L 285 205 L 300 178 L 315 205 L 325 185 L 320 215 L 280 215 Z" fill="url(#frostingGold)" stroke="#d4af37" stroke-width="2"/>
    <circle cx="275" cy="183" r="3" fill="#ffffff"/>
    <circle cx="300" cy="175" r="4" fill="#ffffff"/>
    <circle cx="325" cy="183" r="3" fill="#ffffff"/>
  </g>

  <!-- Candle in center -->
  <rect x="296" y="195" width="8" height="45" rx="3" fill="url(#frostingGold)" stroke="#b8860b" stroke-width="1"/>
  <line x1="300" y1="195" x2="300" y2="182" stroke="#555" stroke-width="2"/>
  <!-- Candle Flame with Glow -->
  <ellipse cx="300" cy="165" rx="9" ry="18" fill="url(#flame)" filter="url(#glowEffect)" class="candle-flame"/>
  <ellipse cx="300" cy="167" rx="4" ry="9" fill="#ffffff"/>

  <!-- Sparkles around cake -->
  <g fill="#ffd700">
    <path d="M 130 290 Q 140 290 140 280 Q 140 290 150 290 Q 140 290 140 300 Q 140 290 130 290" opacity="0.9"/>
    <path d="M 450 260 Q 460 260 460 250 Q 460 260 470 260 Q 460 260 460 270 Q 460 260 450 260" opacity="0.9"/>
    <path d="M 170 190 Q 180 190 180 180 Q 180 190 190 190 Q 180 190 180 200 Q 180 190 170 190" opacity="0.9"/>
    <path d="M 420 380 Q 430 380 430 370 Q 430 380 440 380 Q 430 380 430 390 Q 430 380 420 380" opacity="0.8"/>
  </g>
</svg>